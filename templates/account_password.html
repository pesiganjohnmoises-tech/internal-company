{% extends "base.html" %}
{% block title %}Change password · Internal Company Directory{% endblock %}
{% block content %}
<a class="back" href="{{url_for('home')}}">← Back</a>
<section class="login-shell account-shell">
  <div class="eyebrow">YOUR ACCOUNT</div>
  <h1 class="account-title">Change password</h1>
  <p class="muted">Signed in as <strong>{{user.display_name}}</strong> (@{{user.username}}). Changing your password signs out your other devices.</p>
  <form method="post" class="loginform">
    <input type="hidden" name="csrf_token" value="{{csrf_token()}}">
    <input type="text" name="username" value="{{user.username}}" autocomplete="username" hidden>
    <label>Current password<input type="password" name="current_password" autocomplete="current-password" required autofocus></label>
    <label>New password<input type="password" name="new_password" autocomplete="new-password" minlength="12" required placeholder="At least 12 characters"></label>
    <label>Confirm new password<input type="password" name="confirm_password" autocomplete="new-password" minlength="12" required></label>
    <button class="primary full">Change password <span aria-hidden="true">→</span></button>
  </form>
</section>
{% endblock %}
